# XAMPP Apache preset for Ubuntu Desktop (RAM 8GB)
# File target: /opt/lampp/etc/httpd.conf
# Notes:
# - Keep this with prefork MPM when using mod_php.
# - Tune for local CBT app usage (medium concurrency, lower latency).

ServerTokens Prod
ServerSignature Off

Timeout 45
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 2

<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          5
    MaxRequestWorkers       40
    MaxConnectionsPerChild 1000
</IfModule>

# Compression for text responses
<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/plain text/html text/xml text/css text/javascript application/javascript application/json
</IfModule>

# Browser cache for static assets
<IfModule expires_module>
    ExpiresActive On
    ExpiresByType text/css "access plus 7 days"
    ExpiresByType application/javascript "access plus 7 days"
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType image/jpeg "access plus 30 days"
    ExpiresByType image/gif "access plus 30 days"
    ExpiresByType image/svg+xml "access plus 30 days"
    ExpiresByType font/woff2 "access plus 30 days"
</IfModule>
